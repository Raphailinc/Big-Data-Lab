name: CI

on:
  push:
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - run: sbt -v scalafmtCheckAll test

